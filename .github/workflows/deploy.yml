name: Deploy

# Bei jedem Push auf main ein Deploy in Coolify auslösen.
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   COOLIFY_WEBHOOK  – Deploy-Webhook-URL der Anwendung in Coolify
#   COOLIFY_TOKEN    – Coolify-API-Token mit Berechtigung "deploy"
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Coolify-Deploy auslösen
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::error::Secrets COOLIFY_WEBHOOK und COOLIFY_TOKEN fehlen."
            exit 1
          fi
          curl --fail-with-body -sS -X GET "$WEBHOOK" -H "Authorization: Bearer $TOKEN"
